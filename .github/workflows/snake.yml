name: snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 03xe
          outputs: |
            dist/snake.svg?color_snake=%23f2f2f2&color_dots=%23101010,%232a2a2a,%23555555,%239a9a9a,%23f2f2f2&color_dot_border=%23050505
      - name: commit into main
        run: |
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          git diff --cached --quiet || (git commit -m "chore: regenerate snake" && git pull --rebase && git push)
